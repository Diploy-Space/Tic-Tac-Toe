name: tic_tac_game
description: DROTIX Tic Tac Toe - a fast, competitive game of three in a row.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  audioplayers: ^6.7.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  google_mobile_ads: ^9.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: any
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/icon/music/
    - assets/sfx/

flutter_launcher_icons:
  android: true
  ios: true
  # Zoomed-out icon (logo centred on its own dark background).
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#150910"
  adaptive_icon_foreground: "assets/icon/app_icon_adaptive.png"
