name: tic_tac_game
description: Tic Tac Toe with a dark geometric survival-game theme.
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  connectivity_plus: ^7.3.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^6.2.1
  google_mobile_ads: ^9.2.0
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: any
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0A0C"
  adaptive_icon_foreground: "assets/icon/app_logo.png"
